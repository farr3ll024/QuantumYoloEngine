# .streamlit/config.toml

[theme]
base = "dark"
primaryColor = "#a78bfa"              # purple primary
backgroundColor = "#0b1020"           # slightly deeper than before
secondaryBackgroundColor = "#101833"  # panel background
textColor = "#e5e7eb"
font = "sans serif"

[server]
runOnSave = true

[browser]
gatherUsageStats = false